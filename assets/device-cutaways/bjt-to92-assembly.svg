<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620">
  <title>Representative TO-92 transistor package assembly</title>
  <desc>Sectioned package showing three separate leads, a collector paddle with backside die attach, and two top-side bond wires. Pin order and lead-frame shape vary by part.</desc>
  <metadata>Representative package assembly only. It is intentionally not assigned to a specific TO-92 part number.</metadata>
  <defs>
    <linearGradient id="mold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27343a"/>
      <stop offset="1" stop-color="#11191c"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8edef"/>
      <stop offset="1" stop-color="#72858a"/>
    </linearGradient>
    <style>
      .line{stroke:#10262d;stroke-width:5;stroke-linejoin:round}
      .marker{fill:#087e8b;stroke:#fff;stroke-width:4}
      .number{fill:#fff;font:800 18px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    </style>
  </defs>
  <rect width="620" height="620" fill="#fbfaf7"/>

  <!-- Cutaway molded body -->
  <path d="M92 430V185Q92 62 215 62h190q123 0 123 123v245z" fill="url(#mold)" class="line"/>
  <path d="M160 408V205q0-69 69-69h162q69 0 69 69v203z" fill="#f5f6f3" class="line"/>

  <!-- Three separate leads. The center lead is the collector paddle in this representative assembly. -->
  <path d="M181 568v-338h47v338z" fill="url(#frame)" class="line"/>
  <path d="M286 585V390h48v195z" fill="url(#frame)" class="line"/>
  <path d="M392 568v-338h47v338z" fill="url(#frame)" class="line"/>
  <path d="M244 350h132v82H244z" fill="url(#frame)" class="line"/>

  <!-- Backside collector attach and small die -->
  <rect x="266" y="330" width="88" height="16" fill="#c79436" stroke="#72531e" stroke-width="3"/>
  <rect x="266" y="276" width="88" height="54" rx="3" fill="#567b87" class="line"/>
  <rect x="278" y="268" width="24" height="12" rx="2" fill="#d3dadd" stroke="#485b61" stroke-width="3"/>
  <rect x="319" y="268" width="24" height="12" rx="2" fill="#d3dadd" stroke="#485b61" stroke-width="3"/>

  <!-- Exactly two bond wires: emitter and base. Collector is the die backside. -->
  <path d="M204 224C205 160 286 178 290 270" fill="none" stroke="#d8a033" stroke-width="8" stroke-linecap="round"/>
  <path d="M416 224C415 160 335 178 331 270" fill="none" stroke="#d8a033" stroke-width="8" stroke-linecap="round"/>
  <circle cx="204" cy="224" r="8" fill="#d8a033" stroke="#72531e" stroke-width="3"/>
  <circle cx="416" cy="224" r="8" fill="#d8a033" stroke="#72531e" stroke-width="3"/>

  <g><circle cx="124" cy="126" r="17" class="marker"/><text x="124" y="126" class="number">1</text></g>
  <g><circle cx="416" cy="528" r="17" class="marker"/><text x="416" y="528" class="number">2</text></g>
  <g><circle cx="355" cy="394" r="17" class="marker"/><text x="355" y="394" class="number">3</text></g>
  <g><circle cx="381" cy="185" r="17" class="marker"/><text x="381" y="185" class="number">4</text></g>
</svg>
